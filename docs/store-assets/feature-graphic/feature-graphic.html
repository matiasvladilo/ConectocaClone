<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: #053b84;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Trama diagonal muy sutil: textura sin competir con el logo.
     Nada de gradientes ni glow — el manual de marca los prohíbe. */
  .trama {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.028) 0 2px,
      transparent 2px 22px
    );
  }

  /* Franja mostaza a la izquierda, único acento de color.
     Mostaza sobre navy mide 6.6:1, así que es seguro. */
  .filo {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 12px; background: #f9c404;
  }

  .contenido {
    position: relative;
    padding: 0 68px 0 84px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
  }

  .izquierda { max-width: 568px; }

  /* El ícono REAL de la app (ganso + script), el mismo que la gente va a ver
     en la pantalla de inicio de su teléfono. Su fondo es navy igual que el del
     banner, así que lleva un anillo claro y sombra para que se despegue. */
  .marca {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }

  .icono {
    width: 96px; height: 96px;
    border-radius: 22px;
    display: block;
    box-shadow: 0 10px 28px rgba(0,0,0,0.32);
    outline: 1px solid rgba(255,255,255,0.22);
    outline-offset: -1px;
  }

  .marca-texto { line-height: 1.1; }
  .marca-nombre {
    color: #ffffff;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .marca-bajada {
    color: #f9c404;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  h1 {
    color: #ffffff;
    font-size: 37px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }
  h1 em { color: #f9c404; font-style: normal; }

  p {
    color: rgba(255,255,255,0.78);
    font-size: 20px;
    line-height: 1.4;
  }

  /* Tarjeta clara a la derecha: refleja el layout real del producto
     (franja navy + contenido sobre fondo claro). */
  .mock {
    flex-shrink: 0;
    width: 252px;
    background: #ffffff;
    border-radius: 20px;
    padding: 18px 18px 20px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.26);
  }

  .mock-barra {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 13px; margin-bottom: 13px;
    border-bottom: 1px solid #e5e7eb;
  }
  .mock-titulo { font-size: 13px; font-weight: 700; color: #111827; }
  .mock-chip {
    font-size: 10px; font-weight: 700; color: #053b84;
    background: #fff7e0; border-radius: 999px; padding: 4px 9px;
  }

  .fila {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0;
  }
  .fila + .fila { border-top: 1px solid #f3f4f6; }
  .fila-nombre { font-size: 12px; color: #111827; font-weight: 500; }
  .fila-meta { font-size: 11px; color: #6b7280; }
  .fila-listo { font-size: 11px; font-weight: 700; color: #053b84; }
  .ok { font-size: 11px; font-weight: 700; color: #16a34a; }
</style>
</head>
<body>
  <div class="trama"></div>
  <div class="filo"></div>

  <div class="contenido">
    <div class="izquierda">
      <div class="marca">
        <img class="icono" src="app-icon.png" alt="">
        <div class="marca-texto">
          <div class="marca-nombre">La Oca</div>
          <div class="marca-bajada">Pedidos y stock</div>
        </div>
      </div>

      <h1>Tus locales piden.<br>El stock se <em>descuenta solo.</em></h1>
      <p>Pedidos, despacho y stock para<br>negocios con varios locales.</p>
    </div>

    <div class="mock">
      <div class="mock-barra">
        <span class="mock-titulo">Pedidos de hoy</span>
        <span class="mock-chip">8</span>
      </div>

      <div class="fila">
        <div>
          <div class="fila-nombre">La Reina</div>
          <div class="fila-meta">14 productos</div>
        </div>
        <span class="ok">Despachado</span>
      </div>

      <div class="fila">
        <div>
          <div class="fila-nombre">Bilbao</div>
          <div class="fila-meta">9 productos</div>
        </div>
        <span class="fila-meta">En preparación</span>
      </div>

      <div class="fila">
        <div>
          <div class="fila-nombre">Providencia</div>
          <div class="fila-meta">21 productos</div>
        </div>
        <span class="fila-listo">Listo</span>
      </div>

      <div class="fila">
        <div>
          <div class="fila-nombre">Ñuñoa</div>
          <div class="fila-meta">6 productos</div>
        </div>
        <span class="fila-meta">Pendiente</span>
      </div>
    </div>
  </div>
</body>
</html>
